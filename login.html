
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | NACABS Polytechnic</title>

    <link rel="stylesheet" href="Nacabs project.css">
</head>

<body>

    <header>
       <img src="./nacabs-logo.png.png"
     alt="NACABS Polytechnic Logo"
     class="school-logo">
        <h1>NACABS POLYTECHNIC AKWANGA KABAYI STUDY CENTER</h1>
        <p>Student Portal Login</p>
    </header>

    <main class="login-container">

        <h2>Welcome Back!</h2>

        <p class="form-description">
            Login to access your student dashboard.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="matric">Matriculation Number</label>

                <input
                    type="text"
                    id="matric"
                    placeholder="Enter your matric number"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <p style="text-align: right; margin-top: 5px;">
                <a href="forgot-password.html">Forgot Password?</a>
            </p>

            <button type="submit" class="register-btn">
                Login to Portal
            </button>

            <p id="loginMessage"></p>

            <p class="login-text">
                Don't have an account?
                <a href="signin.html">Create Account</a>
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 NACABS Polytechnic. All Rights Reserved.</p>
    </footer>

    <script src="login.js"></script>
    <script src="password-toggle.js"></script>

</body>
</html>
