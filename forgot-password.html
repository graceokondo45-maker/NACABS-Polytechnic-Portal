
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | NACABS Polytechnic</title>

    <link rel="stylesheet" href="Nacabs project.css">
</head>

<body>

    <header>
        <h1>NACABS POLYTECHNIC</h1>
        <p>Password Recovery</p>
    </header>

    <main class="login-container">

        <h2>Forgot Password?</h2>

        <p class="form-description">
            Enter your matriculation number and registered email
            to reset your password.
        </p>

        <form id="forgotPasswordForm">

            <!-- MATRICULATION NUMBER -->
            <div class="form-group">
                <label for="matric">Matriculation Number</label>

                <input
                    type="text"
                    id="matric"
                    placeholder="Enter your matric number"
                    required>
            </div>


            <!-- EMAIL ADDRESS -->
            <div class="form-group">
                <label for="email">Registered Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required>
            </div>


            <!-- NEW PASSWORD -->
            <div class="form-group">
                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6"
                    required>
            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required>
            </div>


            <!-- RESET BUTTON -->
            <button type="submit" class="register-btn">
                Reset Password
            </button>

            <p id="resetMessage"></p>


            <!-- BACK TO LOGIN -->
            <p class="login-text">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>

        </form>

    </main>


    <footer>
        <p>&copy; 2026 NACABS Polytechnic. All Rights Reserved.</p>
    </footer>


    <!-- PASSWORD RECOVERY JAVASCRIPT -->
    <script src="forgot-password.js"></script>

    <!-- UNIVERSAL PASSWORD EYE -->
    <script src="password-toggle.js"></script>

</body>
</html>
